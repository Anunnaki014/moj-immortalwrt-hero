name: Build Keenetic KN-1012 MT7981 Firmware

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Initialization environment
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang flex bison gawk gcc-multilib g++-multilib gettext git libncurses5-dev libssl-dev libxml-parser-perl lzma swig unzip zlib1g-dev file p7zip-full unzip ccache libelf-dev

      - name: Phase 1 - Cleaning factory code and templates
        run: |
          rm -rf package/emortal/default-settings

      - name: Download and prepare feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a

      - name: Phase 2 - Cleaning downloaded feeds
        run: |
          rm -rf feeds/luci/applications/luci-app-turboacc

      - name: SSH connection to Actions
        uses: P3TERX/ssh2actions@main
        if: false

      - name: Organizing the generated config file
        run: echo "No manual changes"

      - name: Fixing Keenetic DTS link with the kernel
        run: |
          mkdir -p target/linux/mediatek/image/
          ln -sf ../files-5.4/arch/arm64/boot/dts/mediatek/mt7981-keenetic-kn-1012.dts target/linux/mediatek/image/mt7981-keenetic-kn-1012.dts || true

      - name: Compile the firmware
        run: |
          [ -f .config ] || cd openwrt || cd immortalwrt || true
          make defconfig
          make target/linux/compile
          mkdir -p /tmp/target_rootfs
          cp -r build_dir/target-*/root-mediatek/. /tmp/target_rootfs/ || true
          sed -i '/CONFIG_TARGET_ROOTFS_INITRAMFS/d' .config || true
          sed -i '/CONFIG_INITRAMFS_SOURCE/d' .config || true
          echo "CONFIG_TARGET_ROOTFS_INITRAMFS=y" >> .config
          echo 'CONFIG_INITRAMFS_SOURCE="/tmp/target_rootfs"' >> .config
          echo "CONFIG_INITRAMFS_COMPRESSION_GZIP=y" >> .config
          make -j$(nproc) || make -j1 V=s

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ImmortalWrt_Firmware
          path: bin/targets/mediatek/mt7981/*
